# EroBabe — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

# Serverless API → single router function (see netlify/functions/api.ts)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — client-side routes like /watch/:id must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
