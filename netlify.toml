[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Releases bulk-uploaded drafts on their hourly schedule.
[functions."scheduled-publish"]
  schedule = "@hourly"

# Admin/public API → serverless function (kept before the SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Dynamic SEO assets (generated from the live published catalog)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

# Canonical server-rendered video pages. Legacy watch links redirect here.
[[redirects]]
  from = "/watch/:slug"
  to = "/video/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/video/:slug"
  to = "/.netlify/functions/api/seo/video/:slug"
  status = 200
  force = true

# SPA fallback so /watch/:id, /admin, /category/:slug never 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
