name: Publish finished uploads

# Bunny keeps encoding long after the bytes are transferred, and the transfer
# only runs in the administrator's browser — so publication cannot depend on
# that browser. This workflow calls the server-side sweep, which publishes every
# upload that reached Bunny's Finished status, with nobody watching.
#
# It lives in GitHub Actions on purpose: Vercel Hobby rejects cron jobs that run
# more than once a day (the deployment fails outright), and this app is
# explicitly deployable on any plan. The schedule is therefore independent of
# wherever the site is hosted.
on:
  schedule:
    # Every 5 minutes. GitHub Actions allows this; encoding takes far longer, so
    # a finished file becomes public within one interval of Bunny completing it.
    - cron: "*/5 * * * *"
  # Run it by hand from the Actions tab to verify the setup.
  workflow_dispatch:

permissions:
  contents: read

# Never let two sweeps overlap; the endpoint is idempotent anyway.
concurrency:
  group: bunny-publish-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish uploads that finished encoding
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::Add the SITE_URL and CRON_SECRET repository secrets (Settings → Secrets and variables → Actions) to enable auto-publish. Skipping."
            exit 0
          fi
          echo "Sweeping ${SITE_URL%/}/api/cron/bunny-publish"
          curl --silent --show-error --fail-with-body --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/bunny-publish"
          echo