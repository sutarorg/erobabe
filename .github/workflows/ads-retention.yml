name: Delete finished ad banners

on:
  schedule:
    # Rejected banners go immediately from the admin action; this sweep catches
    # ad windows that simply ran out, plus anything a failed delete left behind.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-retention
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Release rejected and expired creatives
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Configure SITE_URL and CRON_SECRET repository secrets so finished ad banners are deleted."
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/ads-retention"
